name: Release

# Publishing is driven by a version tag, not by every push to main. Tag a release with
# `git tag v2.0.0 && git push origin v2.0.0`; the tag name becomes the package version.
on:
  push:
    # Deliberately 'v*' rather than 'v*.*.*'. A prerelease tag such as v1.0.0-preview.1 has a
    # fourth dot-separated part, so 'v*.*.*' only matches it by letting the last wildcard swallow
    # "0-preview.1" — true, but not something a reader should have to work out about a release trigger.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 2.0.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  # Lets the job ask GitHub for an OIDC token, which NuGet.org exchanges for a short-lived API key.
  # This is what removes the need for a long-lived NUGET_API_KEY secret.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the Environment field of the NuGet.org trusted publishing policy, or the token
    # exchange is rejected.
    environment: nuget

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Publishing to NuGet.org cannot be undone: a version can be unlisted but never replaced or
      # removed. The tag is therefore checked against the version committed in
      # src/Directory.Build.props before anything is built, so a typo in the tag fails here rather
      # than becoming a permanent package.
      - name: Resolve and verify version
        id: version
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          # SemVer 2.0.0: major.minor.patch with optional prerelease and build metadata.
          SEMVER='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! printf '%s' "$VERSION" | grep -Eq "$SEMVER"; then
            echo "::error::'$VERSION' is not a valid SemVer version. Tag as vMAJOR.MINOR.PATCH, e.g. v2.0.1 or v1.0.0-preview.1."
            exit 1
          fi

          DECLARED=$(grep -oPm1 '(?<=<Version>)[^<]+' src/Directory.Build.props)
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "::error::Tag version '$VERSION' does not match <Version>$DECLARED</Version> in src/Directory.Build.props. Bump the file, commit it, then tag."
            exit 1
          fi

          echo "Publishing version $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:Version=${{ steps.version.outputs.version }}

      # Never publish a release that does not pass its own test suite.
      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: >
          dotnet pack --no-build --configuration Release
          -p:Version=${{ steps.version.outputs.version }}
          --output ./nupkgs

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs-${{ steps.version.outputs.version }}
          path: ./nupkgs/*

      # Trusted publishing: exchange GitHub's OIDC token for an API key that NuGet.org issues on the
      # spot and expires in an hour. Nothing long-lived is stored in the repository, so there is no
      # secret to leak or rotate — and the key's scope comes from the policy's package owner rather
      # than from a glob pattern, so publishing a new package id needs no extra configuration.
      #
      # This step is deliberately here, immediately before the push, rather than at the top of the job:
      # the key is valid for one hour and the build and test steps above take time.
      #
      # `user` is the nuget.org profile name, not an email address. It is a literal rather than a
      # secret because it is public information — it appears on every package page — and a missing
      # secret would break the release for no security benefit.
      - name: Exchange OIDC token for a NuGet API key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: i7aKeT

      - name: Publish to NuGet.org
        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate
